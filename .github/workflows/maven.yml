name: Maven tests

on:
  push:
    branches:
      - main
      - feature/nexusmarket-sustentacion
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Maven tests
        run: mvn -B clean test
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser JavaScript syntax
        run: |
          awk '/<script>/{flag=1;next}/<\\/script>/{flag=0}flag' src/main/resources/static/index.html > /tmp/nexusmarket-ui.js
          node --check /tmp/nexusmarket-ui.js
